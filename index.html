<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THEO STORE | AI Edition</title>
    <style>
        /* FONDO Y ESTILO GENERAL */
        body { 
            background: #0d0d0d;
            color: #e0e0e0; font-family: 'Segoe UI', sans-serif; 
            margin: 0; padding: 20px; text-align: center;
            padding-bottom: 100px; /* Espacio para el chat */
        }

        .logo { width: 100px; height: 100px; border-radius: 20%; border: 3px solid #00d4ff; box-shadow: 0 0 15px #00d4ff; }
        
        h1 { color: #fff; text-shadow: 0 0 10px #00d4ff; margin: 10px 0; }

        /* GRUPO DE APPS */
        .app-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            max-width: 400px;
            margin: 20px auto;
        }

        .app-card {
            background: #1a1a1a;
            border-radius: 15px;
            padding: 15px;
            border: 1px solid #333;
            transition: 0.3s;
        }

        .app-card:hover { border-color: #00d4ff; transform: scale(1.05); }

        .app-icon-img { width: 50px; height: 50px; object-fit: contain; margin-bottom: 10px; }

        .install-btn {
            background: #00d4ff; color: #000;
            padding: 8px 15px; text-decoration: none;
            border-radius: 10px; font-weight: bold; font-size: 0.8em;
            display: block;
        }

        /* --- SISTEMA DE IA (THEO-BOT) --- */
        #chat-container {
            position: fixed;
            bottom: 20px; right: 20px; left: 20px;
            max-width: 400px; margin: auto;
            background: #222; border: 2px solid #00d4ff;
            border-radius: 15px; padding: 10px;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
            text-align: left;
        }

        #chat-box {
            height: 100px; overflow-y: auto;
            font-size: 0.9em; margin-bottom: 10px;
            padding: 5px; color: #bbb;
            border-bottom: 1px solid #333;
        }

        .bot-msg { color: #00d4ff; font-weight: bold; }
        .user-msg { color: #fff; }

        #user-input {
            width: 70%; background: #333; border: none;
            padding: 10px; color: white; border-radius: 5px;
        }

        #send-btn {
            width: 25%; background: #00d4ff; border: none;
            padding: 10px; border-radius: 5px; font-weight: bold; cursor: pointer;
        }
    </style>
</head>
<body>

    <img src="https://i.imgur.com/8K5M6Yp.png" class="logo">
    <h1>THEO STORE AI</h1>
    <p style="color: #00d4ff;">La primera tienda con Inteligencia Artificial</p>

    <div class="app-grid">
        <div class="app-card">
            <img src="https://i.imgur.com/vD0X4pB.png" class="app-icon-img">
            <h3>STUMBLE</h3>
            <a href="#" class="install-btn">MOD MENU</a>
        </div>
        <div class="app-card">
            <img src="https://i.imgur.com/S6oIuX7.png" class="app-icon-img">
            <h3>G-DASH</h3>
            <a href="#" class="install-btn">FULL 2.2</a>
        </div>
    </div>

    <div id="chat-container">
        <div id="chat-box"><span class="bot-msg">THEO-BOT:</span> ¡Hola! Soy la IA de Theo. Pregúntame por un juego o salúdame.</div>
        <input type="text" id="user-input" placeholder="Escribe aquí...">
        <button id="send-btn" onclick="hablarConIA()">Enviar</button>
    </div>

    <script>
        function hablarConIA() {
            let input = document.getElementById("user-input");
            let chatBox = document.getElementById("chat-box");
            let userText = input.value.toLowerCase();

            if (userText.trim() === "") return;

            // Mostrar mensaje del usuario
            chatBox.innerHTML += `<div><span class="user-msg">Tú:</span> ${input.value}</div>`;
            
            // Lógica de la IA (Cerebro de Theo-Bot)
            let respuesta = "No entiendo eso, pero recuerda que soy un Ninja en entrenamiento.";

            if (userText.includes("hola")) {
                respuesta = "¡Hola, Guerrero! Bienvenido a la Theo Store. ¿Listo para los mejores mods?";
            } else if (userText.includes("stumble")) {
                respuesta = "El Mod de Stumble Guys está listo para descargar arriba. ¡Tiene skins gratis!";
            } else if (userText.includes("dash") || userText.includes("geometry")) {
                respuesta = "Geometry Dash 2.2 es el juego más buscado. ¡Dale al botón azul!";
            } else if (userText.includes("creador") || userText.includes("theo")) {
                respuesta = "El gran Theo es mi creador. Él es el Ninja jefe de esta web.";
            } else if (userText.includes("ia") || userText.includes("robot")) {
                respuesta = "Soy una Inteligencia Artificial creada con código puro para ayudarte.";
            }

            // Responder después de un pequeño retraso
            setTimeout(() => {
                chatBox.innerHTML += `<div><span class="bot-msg">THEO-BOT:</span> ${respuesta}</div>`;
                chatBox.scrollTop = chatBox.scrollHeight;
            }, 500);

            input.value = ""; // Limpiar buscador
        }

        // Permitir enviar con la tecla Enter
        document.getElementById("user-input").addEventListener("keypress", function(e) {
            if (e.key === "Enter") hablarConIA();
        });
    </script>
</body>
</html>
