<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THEO STORE AI - OFICIAL</title>
    <style>
        :root {
            --neon-blue: #00d4ff;
            --bg-dark: #050505;
        }

        body { 
            background-color: var(--bg-dark); 
            color: white; 
            font-family: 'Segoe UI', sans-serif; 
            margin: 0; padding: 20px;
            text-align: center;
        }

        h1 { color: var(--neon-blue); text-shadow: 0 0 15px var(--neon-blue); font-size: 2.5rem; }

        .container { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; }

        .card { 
            background: #111; border: 2px solid #222; border-radius: 15px; 
            width: 280px; padding: 15px; transition: 0.3s;
        }

        .card:hover { 
            border-color: var(--neon-blue); transform: translateY(-10px);
            box-shadow: 0 0 20px var(--neon-blue);
        }

        .btn { 
            display: inline-block; background: var(--neon-blue); color: black; 
            padding: 12px; border-radius: 8px; text-decoration: none; 
            font-weight: bold; margin-top: 10px; width: 90%;
        }

        /* AJUSTES PARA TV */
        @media (min-width: 1200px) {
            h1 { font-size: 5rem; }
            .card { width: 400px; padding: 30px; }
            .btn { font-size: 1.8rem; }
            #chat { max-width: 800px; }
        }

        /* CHAT IA */
        #chat { 
            margin: 40px auto; background: #0a0a0a; border: 1px solid #333;
            border-radius: 20px; padding: 20px; max-width: 450px;
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.2);
        }

        #log { height: 150px; overflow-y: auto; text-align: left; margin-bottom: 10px; padding-right: 5px; }
        #log::-webkit-scrollbar { width: 5px; }
        #log::-webkit-scrollbar-thumb { background: var(--neon-blue); border-radius: 10px; }
        
        .chat-input { display: flex; gap: 10px; }
        input { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #333; background: #000; color: white; outline: none; }
        input:focus { border-color: var(--neon-blue); }
    </style>
</head>
<body>

    <h1>👁️ THEO STORE AI 👁️</h1>
    <p style="color: #555;">ALIANZA X&G | ACTUALIZADO PARA TV</p>

    <div class="container">

            <img src="https://via.placeholder.com/250x140/00d4ff/000000?text=DIXMAX+V2.4.1" style="width:100%; border-radius:10px;">

            <p>Cine y Series Gratis v2.4.1</p>
