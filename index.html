<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THEO STORE AI - OFICIAL</title>
    <style>
        body {
            background-color: #050505;
            color: white;
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        h1 { color: #00d4ff; text-shadow: 0 0 15px #00d4ff; margin-bottom: 5px; }
        .sub { color: #555; font-size: 0.9em; margin-bottom: 30px; }
        
        .tienda-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
        }

        .tarjeta {
            background: #111;
            border: 2px solid #00d4ff;
            border-radius: 20px;
            padding: 15px;
            width: 260px;
            transition: 0.3s;
            box-shadow: 0 0 10px rgba(0, 212, 255, 0.1);
        }
        .tarjeta:hover { transform: scale(1.05); box-shadow: 0 0 20px #00d4ff; }

        .img-juego {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 15px;
            background-color: #222;
        }

        .btn-descarga {
            background-color: #00d4ff;
            color: black;
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            margin-top: 15px;
            width: 80%;
        }

        /* --- SECCIÓN CHAT --- */
        #chat-container {
            margin: 40px auto;
            max-width: 500px;
            background: #0a0a0a;
            border: 2px solid #333;
            padding: 15px;
            border-radius: 20px;
        }
        #chat-log {
            height: 200px;
            overflow-y: auto;
            border-bottom: 1px solid #222;
            margin-bottom: 15px;
            text-align: left;
            padding: 10px;
            font-size: 0.9em;
        }
        .input-box {
            display: flex;
            gap: 10px;
        }
        input {
            flex-grow: 1;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #00d4ff;
            background: #000;
            color: white;
        }
    </style>
</head>
<body>

    <h1>👁️ THEO STORE AI 👁️</h1>
    <div class="sub">ALIANZA X&G - BY XTHEOR</div>

    <div class="tienda-container">
        
        <div class="tarjeta">
            <img src="https://via.placeholder.com/250x150/00d4ff/000000?text=DIXMAC+OFICIAL" class="img-juego">
            <h3>DIXMAC</h3>
            <p>Series y Películas Gratis</p>
            <a href="LINK_DE_DIXMAC_AQUI" target="_blank" class="btn-descarga">DESCARGAR APK</a>
        </div>

        <div class="tarjeta">
            <img src="https://via.placeholder.com/250x150/00d4ff/000000?text=STUMBLE+MOD" class="img-juego">
            <h3>STUMBLE MOD</h3>
            <p>V0.64 - Skins Unlocked</p>
            <a href="LINK_STUMBLE_AQUI" target="_blank" class="btn-descarga">DESCARGAR APK</a>
        </div>

        <div class="tarjeta">
            <img src="https://via.placeholder.com/250x150/00d4ff/000000?text=GDASH+2.2" class="img-juego">
            <h3>G-DASH 2.2</h3>
            <p>Todo desbloqueado</p>
            <a href="LINK_GDASH_AQUI" target="_blank" class="btn-descarga">DESCARGAR APK</a>
        </div>

    </div>

    <div id="chat-container">
        <h3 style="color:#00d4ff;">🤖 THEO-BOT (SISTEMA)</h3>
        <div id="chat-log">
            <p style="color: #00d4ff;">[IA]: XTHEOR, DixMac ha sido añadido a la base de datos.</p>
        </div>
        <div class="input-box">
            <input type="text" id="user-input" placeholder="Pregunta sobre un Mod...">
            <button onclick="enviarMensaje()" class="btn-descarga" style="width: auto; margin:0;">JUTSU</button>
        </div>
    </div>

    <script>
        function enviarMensaje() {
            let input = document.getElementById("user-input");
            let chatLog = document.getElementById("chat-log");
            let texto = input.value.toLowerCase();

            if (texto !== "") {
                chatLog.innerHTML += `<p><b>TÚ:</b> ${texto}</p>`;
                
                let respuesta = "Buscando en los archivos de la Alianza...";
                if (texto.includes("hola")) respuesta = "¡A la orden, Sensei XTHEOR!";
                if (texto.includes("dixmac")) respuesta = "DixMac está listo. Es la mejor opción para ver cine gratis.";
                if (texto.includes("stumble")) respuesta = "El Mod Menu de Stumble ya está en la tienda.";
                if (texto.includes("dash")) respuesta = "Geometry Dash 2.2 disponible para descarga.";

                chatLog.innerHTML += `<p style="color: #00d4ff;"><b>BOT:</b> ${respuesta}</p>`;
                input.value = "";
                chatLog.scrollTop = chatLog.scrollHeight;
            }
        }
    </script>

</body>
</html>
