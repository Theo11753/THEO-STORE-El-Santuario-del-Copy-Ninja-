<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>GokoLang</title>
<style>
    body {
        background: #111;
        color: white;
        font-family: Arial;
        text-align: center;
    }
    textarea {
        width: 80%;
        height: 100px;
        margin: 10px;
        font-size: 16px;
    }
    button {
        padding: 10px 20px;
        font-size: 16px;
        background: lime;
        border: none;
        cursor: pointer;
    }
    #resultado {
        margin-top: 20px;
        font-size: 18px;
    }
</style>
</head>

<body>

<h1>🔥 GokoLang</h1>

<textarea id="entrada" placeholder="Escribe T-Lang..."></textarea><br>

<button onclick="ejecutar()">Ejecutar</button>

<div id="resultado"></div>

<script>
let monedas = {
    theo: 0,
    ia1: 0
};

function ejecutar() {
    let texto = document.getElementById("entrada").value;
    let salida = document.getElementById("resultado");

    if (texto.startsWith("[.moneda")) {
        let partes = texto.replace("[.","").replace(".]","").split(" ");
        let usuario = partes[1];
        let valor = parseInt(partes[2]);

        if (!monedas[usuario]) monedas[usuario] = 0;

        monedas[usuario] += valor;

        salida.innerHTML = "💰 " + usuario + " ahora tiene " + monedas[usuario];

    } else if (texto.startsWith("[.decir")) {
        let mensaje = texto.replace("[.decir ","").replace(".]","");
        salida.innerHTML = "💬 " + mensaje;

    } else if (texto.startsWith("[.spawn")) {
        let objeto = texto.replace("[.spawn ","").replace(".]","");
        salida.innerHTML = "👾 Apareció: " + objeto;

    } else {
        salida.innerHTML = "❌ Comando no reconocido";
    }
}
</script>

</body>
</html>
